spring.application.name=digitalhub-backend
server.port=${PORT:8080}

# Embedded Database (H2 with MySQL syntax compatibility mode for zero-setup evaluation)
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/digitalhubdb;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Disable automatic schema.sql execution on H2; Hibernate DDL creates tables automatically
spring.sql.init.mode=never

# H2 Console (available at http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# JWT Configuration (Supports environment variable override)
app.jwt.secret=${JWT_SECRET:9a6f8b2c4e1d7a3b5c8e0f2a4d6b8c1e3f5a7b9c2d4e6f8a0b2c4d6e8f0a2b4c}
app.jwt.expiration-ms=${JWT_EXPIRATION:86400000}

# File Upload Configuration
file.upload-dir=./uploads
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# Static Resource Handling (serve frontend directly from root)
spring.web.resources.static-locations=classpath:/static/,file:./frontend/