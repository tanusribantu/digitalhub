# Production MySQL Configuration (activate with --spring.profiles.active=mysql)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/digitalhub_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# JWT Configuration
app.jwt.secret=${JWT_SECRET:9a6f8b2c4e1d7a3b5c8e0f2a4d6b8c1e3f5a7b9c2d4e6f8a0b2c4d6e8f0a2b4c}
app.jwt.expiration-ms=${JWT_EXPIRATION:86400000}

file.upload-dir=./uploads