<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In – DigitalHub</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link rel="stylesheet" href="css/main.css" />
</head>
<body style="display: flex; flex-direction: column; justify-content: center; min-height: 100vh; background: radial-gradient(circle at 50% 10%, rgba(99, 102, 241, 0.15) 0%, var(--dark-bg) 70%);">

  <div class="container" style="max-width: 460px; margin: auto; padding: 2.5rem 1.5rem;">
    <div style="text-align: center; margin-bottom: 2rem;">
      <a href="index.html" class="nav-brand" style="display: inline-flex; justify-content: center; margin-bottom: 1rem;">
        <div class="brand-icon"><i class="fa-solid fa-cube"></i></div>
        <span style="font-size: 1.6rem;">Digital<span class="brand-gradient">Hub</span></span>
      </a>
      <h2 style="color: #fff; font-size: 1.6rem; font-weight: 800;">Welcome back</h2>
      <p style="color: var(--text-muted); font-size: 0.9rem; margin-top: 0.25rem;">Sign in to access your purchases, licenses, and dashboard</p>
    </div>

    <!-- Quick Demo Logins for Instant Testing -->
    <div style="background: rgba(99, 102, 241, 0.08); border: 1px dashed rgba(99, 102, 241, 0.35); border-radius: var(--radius-md); padding: 1rem; margin-bottom: 1.5rem; text-align: center;">
      <div style="font-size: 0.78rem; font-weight: 700; color: #a5b4fc; text-transform: uppercase; margin-bottom: 0.5rem; letter-spacing: 0.5px;">
        ⚡ 1-Click Evaluation Credentials
      </div>
      <div style="display: flex; gap: 0.4rem; justify-content: center; flex-wrap: wrap;">
        <button type="button" class="btn btn-secondary" onclick="fillDemo('customer')" style="padding: 0.35rem 0.65rem; font-size: 0.78rem;">
          <i class="fa-solid fa-user"></i> Customer
        </button>
        <button type="button" class="btn btn-secondary" onclick="fillDemo('seller')" style="padding: 0.35rem 0.65rem; font-size: 0.78rem;">
          <i class="fa-solid fa-store"></i> Seller
        </button>
        <button type="button" class="btn btn-secondary" onclick="fillDemo('admin')" style="padding: 0.35rem 0.65rem; font-size: 0.78rem;">
          <i class="fa-solid fa-shield-halved"></i> Admin
        </button>
      </div>
    </div>

    <div style="background: var(--card-bg); border: 1px solid var(--border-color); border-radius: var(--radius-lg); padding: 2.25rem; box-shadow: var(--shadow-lg);">
      <form id="loginForm" onsubmit="handleLogin(event)">
        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" class="form-control" placeholder="name@domain.com" required />
        </div>

        <div class="form-group">
          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.45rem;">
            <label for="password" style="margin-bottom: 0;">Password</label>
            <a href="#" style="font-size: 0.8rem; color: var(--primary);">Forgot password?</a>
          </div>
          <div style="position: relative;">
            <input type="password" id="password" class="form-control" placeholder="••••••••" required />
            <button type="button" onclick="togglePasswordVisibility('password')" style="position: absolute; right: 1rem; top: 50%; transform: translateY(-50%); background: none; color: var(--text-muted);">
              <i class="fa-regular fa-eye" id="passwordEye"></i>
            </button>
          </div>
        </div>

        <button type="submit" id="loginBtn" class="btn btn-primary" style="width: 100%; padding: 0.8rem; font-size: 1rem; margin-top: 1rem;">
          Sign In
        </button>
      </form>

      <div style="text-align: center; margin-top: 1.75rem; font-size: 0.88rem; color: var(--text-muted);">
        Don't have an account? <a href="register.html" style="color: var(--primary); font-weight: 600;">Create one free</a>
      </div>
    </div>

    <div style="text-align: center; margin-top: 1.5rem;">
      <a href="index.html" style="font-size: 0.85rem; color: var(--text-light);"><i class="fa-solid fa-arrow-left"></i> Back to Homepage</a>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script>
    function fillDemo(role) {
      if (role === 'customer') {
        document.getElementById('email').value = 'customer@digitalhub.com';
        document.getElementById('password').value = 'customer123';
      } else if (role === 'seller') {
        document.getElementById('email').value = 'seller@digitalhub.com';
        document.getElementById('password').value = 'seller123';
      } else if (role === 'admin') {
        document.getElementById('email').value = 'admin@digitalhub.com';
        document.getElementById('password').value = 'admin123';
      }
      showToast(`Filled credentials for ${role.toUpperCase()}`, 'info');
    }

    function togglePasswordVisibility(fieldId) {
      const field = document.getElementById(fieldId);
      const eye = document.getElementById(fieldId + 'Eye');
      if (field.type === 'password') {
        field.type = 'text';
        eye.classList.replace('fa-eye', 'fa-eye-slash');
      } else {
        field.type = 'password';
        eye.classList.replace('fa-eye-slash', 'fa-eye');
      }
    }

    async function handleLogin(e) {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      const btn = document.getElementById('loginBtn');
      btn.disabled = true;
      btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Authenticating...';

      try {
        const res = await api.post('/auth/login', { email, password });
        setAuthSession(res);
        showToast('Login successful! Redirecting...', 'success');

        const urlParams = new URLSearchParams(window.location.search);
        const redirect = urlParams.get('redirect');

        setTimeout(() => {
          if (redirect) {
            window.location.href = redirect;
          } else if (res.role === 'ROLE_ADMIN') {
            window.location.href = 'admin-dashboard.html';
          } else if (res.role === 'ROLE_SELLER') {
            window.location.href = 'seller-dashboard.html';
          } else {
            window.location.href = 'products.html';
          }
        }, 800);
      } catch (err) {
        showToast(err.message, 'error');
        btn.disabled = false;
        btn.innerText = 'Sign In';
      }
    }
  </script>
</body>
</html>
